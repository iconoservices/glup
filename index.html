<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f18" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.9rem;
        background: #0b0f18;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      #splash.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
      #splash svg { width: 58px; height: 58px; animation: splash-float 1.6s ease-in-out infinite; }
      #splash b {
        font-family: 'Fredoka', system-ui, sans-serif;
        font-weight: 700;
        font-size: 1.9rem;
        letter-spacing: 0.02em;
        color: #1fa8ff;
      }
      #splash span {
        font-family: system-ui, sans-serif;
        font-size: 0.66rem;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: #6b7688;
      }
      @keyframes splash-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-7px); }
      }
      @media (prefers-reduced-motion: reduce) { #splash svg { animation: none; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M256 92C256 92 150 214 150 312a106 106 0 1 0 212 0C362 214 256 92 256 92Z" fill="#1fa8ff" />
        <circle cx="330" cy="150" r="30" fill="#ffce3a" />
      </svg>
      <b>Glup Juegos</b>
      <span>Cargando</span>
    </div>
    <div id="root"><!--app-html--></div>
    <script>
      (function () {
        var s = document.getElementById('splash');
        if (!s) return;
        function hide() { s.classList.add('is-hidden'); setTimeout(function () { s.remove(); }, 500); }
        if (document.readyState === 'complete') setTimeout(hide, 350);
        else window.addEventListener('load', function () { setTimeout(hide, 350); });
        setTimeout(hide, 4000); // tope de seguridad
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
